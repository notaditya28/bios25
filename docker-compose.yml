# Local development stack. Production overrides live in infra/ (Milestone 7).
x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./backend:/app
    - source-cache:/data/cache

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A app.worker worker --loglevel=INFO --concurrency=2

  beat:
    <<: *backend
    command: celery -A app.worker beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

volumes:
  pgdata:
  source-cache:
